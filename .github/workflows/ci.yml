name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -v

      - name: Smoke test the command
        run: |
          name-sorter ./unsorted-names-list.txt > actual-output.txt
          cat > expected-output.txt << 'EOF'
          Marin Alvarez
          Adonis Julius Archer
          Beau Tristan Bentley
          Hunter Uriah Mathew Clarke
          Leo Gardner
          Vaughn Lewis
          London Lindsey
          Mikayla Lopez
          Janet Parsons
          Frankie Conner Ritter
          Shelby Nathan Yoder
          EOF
          diff actual-output.txt expected-output.txt
          diff sorted-names-list.txt expected-output.txt